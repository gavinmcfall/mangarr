  <!-- Global action feedback: top progress bar + toasts (action-feedback design) -->
  <div id="mangarr-progress" aria-hidden="true"><div class="bar"></div></div>
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
  <script>
  (function () {
    var bar = document.getElementById('mangarr-progress');
    var inflight = 0;

    // Periodic background pollers (e.g. the 5s downloads badge) must not
    // flicker the bar or raise toasts. They carry hx-trigger="... every Ns".
    function isBackgroundPoll(elt) {
      if (!elt || !elt.getAttribute) return false;
      return (elt.getAttribute('hx-trigger') || '').indexOf('every') !== -1;
    }
    function showBar() { if (bar) bar.classList.add('is-loading'); }
    function endBar() {
      if (!bar) return;
      bar.classList.add('is-done');
      bar.classList.remove('is-loading');
      window.setTimeout(function () { bar.classList.remove('is-done'); }, 350);
    }

    document.body.addEventListener('htmx:beforeRequest', function (evt) {
      if (isBackgroundPoll(evt.detail.elt)) return;
      inflight++;
      showBar();
    });
    document.body.addEventListener('htmx:afterRequest', function (evt) {
      if (isBackgroundPoll(evt.detail.elt)) return;
      inflight = Math.max(0, inflight - 1);
      if (inflight === 0) endBar();
      if (evt.detail && evt.detail.successful === false) {
        var xhr = evt.detail.xhr;
        var msg = (xhr && xhr.responseText && xhr.responseText.length > 0 && xhr.responseText.length < 140)
          ? xhr.responseText.trim() : 'Something went wrong';
        window.mangarrToast(msg, 'error');
      }
    });

    window.mangarrToast = function (message, kind) {
      var c = document.getElementById('toast-container');
      if (!c) return;
      var t = document.createElement('div');
      t.className = 'toast toast-' + (kind === 'error' ? 'error' : 'success');
      t.textContent = message;
      t.addEventListener('click', function () { t.remove(); });
      c.appendChild(t);
      window.setTimeout(function () { t.classList.add('toast-out'); }, 3600);
      window.setTimeout(function () { if (t.parentNode) t.remove(); }, 4000);
    };

    // One-shot server flash: a mutating handler set the mangarr_flash cookie
    // ("kind|message"); show it once on the next page load, then clear it.
    function readFlash() {
      var m = document.cookie.match(/(?:^|;\s*)mangarr_flash=([^;]+)/);
      if (!m) return;
      document.cookie = 'mangarr_flash=; Path=/; Max-Age=0';
      var raw;
      try { raw = decodeURIComponent(m[1]); } catch (e) { return; }
      var sep = raw.indexOf('|');
      if (sep === -1) return;
      window.mangarrToast(raw.slice(sep + 1), raw.slice(0, sep));
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', readFlash);
    } else {
      readFlash();
    }
  })();
  </script>
