{{define "binding-rows"}}
{{$libs := .KavitaLibraries}}
{{range .Bindings}}
<div class="binding-row-card" data-binding-id="{{.ID}}">
  <input type="hidden" name="binding_id_{{.ID}}" value="{{.ID}}">
  <div class="binding-row-header">
    <span class="binding-row-title">{{if .Name}}{{.Name}}{{else}}New binding{{end}}</span>
    <button type="button" class="btn-sm binding-delete"
      onclick="this.closest('.binding-row-card').remove()"
      title="Delete binding">&#x2715;</button>
  </div>
  <div class="binding-row-grid">
    <label class="binding-field">
      <span class="binding-field-label">Library Name</span>
      <input type="text" name="binding_name_{{.ID}}" value="{{.Name}}"
        placeholder="Manga, Manhwa 18+, …" class="binding-name">
    </label>
    <label class="binding-field">
      <span class="binding-field-label">Library Path</span>
      <div class="settings-input-with-browse">
        <input type="text" name="binding_library_root_{{.ID}}" id="binding_library_root_{{.ID}}"
          value="{{.LibraryRoot}}" placeholder="/media/Library/…" class="binding-root">
        <button type="button" class="btn-browse" title="Browse filesystem"
          hx-get="/api/browse/fragment"
          hx-vals='js:{path: document.getElementById("binding_library_root_{{.ID}}").value || "/media", target: "binding_library_root_{{.ID}}"}'
          hx-target="#browse-modal-body"
          hx-swap="innerHTML"
          onclick="document.getElementById('browse-modal').classList.add('browse-modal-open')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v8.25m19.5 0A2.25 2.25 0 0 1 19.5 16.5h-15a2.25 2.25 0 0 1-2.25-2.25m19.5 0v-7.5A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v7.5" /></svg>
          Browse
        </button>
      </div>
    </label>
    <label class="binding-field">
      <span class="binding-field-label">Kavita Library</span>
      <select name="binding_kavita_lib_{{.ID}}" class="binding-kavita"
        onchange="window.fillBindingRootFromKavita && window.fillBindingRootFromKavita(this)">
        <option value="0" data-folder="">(none)</option>
        {{$current := .KavitaLibID}}
        {{if and (gt $current 0) (kavitaLibNotInList $current $libs)}}<option value="{{$current}}" data-folder="" selected>Unknown (ID: {{$current}})</option>{{end}}
        {{range $libs}}<option value="{{.ID}}" data-folder="{{kavitaLibFirstFolder .}}"{{if eq .ID $current}} selected{{end}}>{{.Name}}{{with kavitaLibFirstFolder .}} &mdash; {{.}}{{end}}</option>{{end}}
      </select>
    </label>
    <label class="binding-adult">
      <input type="checkbox" name="binding_default_is_adult_{{.ID}}"{{if .DefaultIsAdult}} checked{{end}}>
      <span>18+</span>
    </label>
  </div>
</div>
{{end}}
{{end}}
